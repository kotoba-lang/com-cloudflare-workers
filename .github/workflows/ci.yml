name: ci

on:
  push:
  pull_request:

jobs:
  nbb:
    # First-class runtime: the full suite including the .cljs provider.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g nbb@1.4.210
      - run: npm test

  jvm:
    # Parity evidence: the same .cljc core under a second reader/runtime.
    # The provider is workerd-only and is excluded here by namespace.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: latest
      - run: clojure -M:test
      - run: clojure -M:lint
